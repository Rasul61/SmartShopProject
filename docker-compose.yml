version: '3.3'
services:
  redis:
    container_name: redis11
    image: redis
    ports:
      - "6379:6379"
    volumes:
      - db_data:/data

  pgis:
    hostname: postgres_db_data
    container_name: postgres_db_data
    image: postgres
    ports:
      - "5050:5432"
    volumes:
      - db_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: java_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: j@varasul2005



  adminer:
    image: adminer:latest
    ports:
      - "8082:8080"
    depends_on:
      - pgis

volumes:
  db_data: { }
