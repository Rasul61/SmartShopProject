spring:
  application:
    name: SmartShop

  messages:
    basename: message
    encoding: UTF-8


  datasource:
    url: jdbc:postgresql://localhost:5432/smart_shop
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true

application:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration: 900000
      refresh-token-expiration: 604800000



server:
  port: 8077