databaseChangeLog:
  - changeSet:
      id: 20260406-02
      author: Rasul
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: text

              - column:
                  name: price
                  type: decimal(10,2)
                  constraints:
                    nullable: false


              - column:
                  name: quantity
                  type: integer
                  constraints:
                    nullable: false

              - column:
                  name: category
                  type: varchar(100)

              - column:
                  name: deleted
                  type: boolean
                  defaultValueBoolean: false

              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP

              - column:
                  name: updated_at
                  type: timestamp
