databaseChangeLog:
  - changeSet:
      id: 20260406-05
      author: Rasul
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: order_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: product_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: quantity
                  type: integer
                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: decimal(10,2)
                  constraints:
                    nullable: false




        - changeSet:
            id: 20260406-06
            author: Rasul
            changes:
              - addForeignKeyConstraint:
                  baseTableName: order_items
                  baseColumnNames: order_id
                  referencedTableName: orders
                  referencedColumnNames: id
                  constraintName: fk_order_items_order

              - addForeignKeyConstraint:
                  baseTableName: order_items
                  baseColumnNames: product_id
                  referencedTableName: products
                  referencedColumnNames: id
                  constraintName: fk_order_items_product
