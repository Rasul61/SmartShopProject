databaseChangeLog:
  - changeSet:
      id: 20260406-10-create-wishlist
      author: Rasul
      changes:
        - createTable:
            tableName: wishlists
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: product_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP

        - addForeignKeyConstraint:
            baseTableName: wishlists
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_wishlist_user

        - addForeignKeyConstraint:
            baseTableName: wishlists
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_wishlist_product

        - addUniqueConstraint:
            tableName: wishlists
            columnNames: user_id, product_id
            constraintName: uk_wishlist_user_product